name: Feature
description: New functionality
labels: ["type:feature"]
body:
  - type: textarea
    id: context
    attributes: { label: Context, description: Why this is needed }
    validations: { required: true }
  - type: textarea
    id: behavior
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      { label: Acceptance criteria, description: Checklist, value: "- [ ] " }
    validations: { required: true }
  - type: textarea
    id: notes
    attributes: { label: Technical notes / dependencies }
