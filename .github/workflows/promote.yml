# Promotes an environment branch forward (dev -> beta, beta -> main) through a PR.
#   action=open  : verify gates, open (or reuse) the promotion PR. Nothing is merged.
#                  If the org forbids Actions from creating PRs, open it by hand:
#                  gh pr create --base beta --head dev
#   action=merge : verify gates again, report whether the owner's optional review
#                  ran on the source head (beta), merge the PR, tag on
#                  main when a version is given.
# Vercel deploys on push through its GitHub App (webhooks fire even for GITHUB_TOKEN merges).
name: promote
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Branch to promote into"
        type: choice
        options: [beta, main]
        required: true
      action:
        description: "open the promotion PR, or merge it"
        type: choice
        options: [open, merge]
        default: open
      version:
        description: "vX.Y.Z - tag + GitHub Release (main + merge only, optional)"
        type: string
        required: false
permissions:
  contents: write
  pull-requests: write
concurrency: promote
jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET: ${{ inputs.target }}
      ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve source branch
        run: |
          case "$TARGET" in
            beta) echo "SOURCE=dev"  >> "$GITHUB_ENV" ;;
            main) echo "SOURCE=beta" >> "$GITHUB_ENV" ;;
          esac
      # A promotion merges with a merge commit the source never gets, so "target is an
      # ancestor of source" fails on every second promotion. What must hold is that the
      # merged tree equals the tested source tree (same gate as the backend's promote).
      - name: Merged tree must equal the source tree (target has no content missing from source)
        run: |
          SHA=$(git rev-parse "origin/$SOURCE")
          if ! MERGED=$(git merge-tree --write-tree "origin/$TARGET" "$SHA"); then
            echo "::error::merging $SOURCE into $TARGET conflicts; bring $TARGET's changes into $SOURCE first"
            exit 1
          fi
          if [[ "$(git rev-parse "origin/$TARGET^{tree}")" == "$(git rev-parse "$SHA^{tree}")" ]]; then
            echo "::notice::$TARGET already has the content of $SOURCE - nothing to promote"
            echo "NOOP=1" >> "$GITHUB_ENV"
          elif [[ "$MERGED" != "$(git rev-parse "$SHA^{tree}")" ]]; then
            echo "::error::$TARGET has changes missing from $SOURCE (merged tree differs from the tested one):"
            git diff --stat "$SHA" "$MERGED"
            exit 1
          fi
      - name: Source tree must be green (ci)
        if: env.NOOP != '1'
        run: |
          SHA=$(git rev-parse "origin/$SOURCE")
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          # A GITHUB_TOKEN promotion merge never gets its own ci run. Its tree equals
          # the promoted parent's, so follow tree-identical parents to the tested commit.
          TESTED="$SHA"
          while [[ -z "$(gh run list --workflow ci --commit "$TESTED" --limit 1 --json databaseId -q '.[0].databaseId // empty')" ]]; do
            NEXT=""
            for P in $(git rev-list --parents -n 1 "$TESTED" | cut -d' ' -f2-); do
              [[ "$(git rev-parse "$P^{tree}")" == "$(git rev-parse "$TESTED^{tree}")" ]] && { NEXT="$P"; break; }
            done
            [[ -n "$NEXT" ]] || { echo "::error::no ci run for $SHA nor for a commit with the same tree"; exit 1; }
            echo "no ci run on $TESTED; its tree equals parent $NEXT"
            TESTED="$NEXT"
          done
          C=$(gh run list --workflow ci --commit "$TESTED" --limit 1 \
              --json status,conclusion -q '.[0] | "\(.status)/\(.conclusion)"')
          echo "ci on $TESTED: $C"
          [[ "$C" == "completed/success" ]] || { echo "::error::ci is not green for $TESTED"; exit 1; }
      - name: Find or open the promotion PR
        if: env.NOOP != '1'
        run: |
          PR=$(gh pr list --base "$TARGET" --head "$SOURCE" --state open --json number -q '.[0].number')
          if [[ -z "$PR" ]]; then
            BODY=$(printf 'Promotion of `%s` (%s) into `%s`.\n\nCommits:\n%s\n\nCI on the source tree is green; the promote gate checked that the merged tree equals the tested source tree.\n' \
              "$SOURCE" "${SHA:0:7}" "$TARGET" "$(git log --oneline --no-merges "origin/$TARGET..origin/$SOURCE" | sed 's/^/- /')")
            if ! PR=$(gh pr create --base "$TARGET" --head "$SOURCE" \
                 --title "promote: $SOURCE -> $TARGET (${SHA:0:7})" --body "$BODY" | grep -oE '[0-9]+$'); then
              echo "::error::could not open the PR (org forbids Actions from creating PRs). Open it by hand: gh pr create --base $TARGET --head $SOURCE"
              exit 1
            fi
          fi
          echo "promotion PR #$PR"
          echo "PR=$PR" >> "$GITHUB_ENV"
      - name: Report whether the owner's review ran on this head (informative, not a gate)
        if: env.NOOP != '1' && inputs.action == 'merge' && inputs.target == 'beta'
        run: |
          RV=$(gh run list --workflow pr-review --branch "$SOURCE" --commit "$SHA" --status success --limit 1 \
               --json databaseId -q '.[0] | select(. != null) | .databaseId')
          if [[ -z "$RV" ]]; then
            echo "::notice::no successful pr-review run for $SHA - merging without an autonomous review (optional by decision 0013)"
          else
            echo "pr-review run $RV is green for $SHA"
          fi
      - name: Merge the promotion PR
        if: env.NOOP != '1' && inputs.action == 'merge'
        run: |
          gh pr merge "$PR" --merge --subject "promote: $SOURCE -> $TARGET (${SHA:0:7})"
      - name: Tag and release
        if: env.NOOP != '1' && inputs.action == 'merge' && inputs.target == 'main' && inputs.version != ''
        run: |
          git fetch origin main
          git tag -a "${{ inputs.version }}" origin/main -m "Brain Trails frontend ${{ inputs.version }}"
          git push origin "${{ inputs.version }}"
          gh release create "${{ inputs.version }}" --target main --generate-notes --title "${{ inputs.version }}"
