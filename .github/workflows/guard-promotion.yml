# Which branches may open a pull request into beta and main (decision 0013, v2).
#
# beta: any feature branch - that is where work lands now, one pull request at a time,
#       merged by the owner. Never dev (it is beta plus every open pull request, rebuilt by
#       `integrate`: merging it would take them all in at once) and never main.
# main: only beta, or a hotfix/*. Promotions are merged with a merge commit.
name: guard-promotion
on:
  pull_request:
    branches: [beta, main]
    types: [opened, reopened, synchronize, edited]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check the source branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$BASE" in
            beta)
              if [[ "$HEAD" == "dev" || "$HEAD" == "main" ]]; then
                echo "::error::'$HEAD' may not be merged into beta: open the pull request from your feature branch."
                exit 1
              fi ;;
            main)
              if [[ "$HEAD" != "beta" && "$HEAD" != hotfix/* ]]; then
                echo "::error::Pull requests into main come from 'beta' or 'hotfix/*' (got '$HEAD')."
                exit 1
              fi ;;
          esac
          echo "ok: $HEAD -> $BASE"
