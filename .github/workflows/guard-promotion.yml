# Environment branches only move forward along dev -> beta -> main (or a hotfix/*).
name: guard-promotion
on:
  pull_request:
    branches: [beta, main]
    types: [opened, reopened, synchronize, edited]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check the source branch
        run: |
          BASE="${{ github.base_ref }}"; HEAD="${{ github.head_ref }}"
          case "$BASE" in
            beta) ALLOWED="dev" ;;
            main) ALLOWED="beta" ;;
          esac
          if [[ "$HEAD" == "$ALLOWED" || "$HEAD" == hotfix/* ]]; then
            echo "ok: $HEAD -> $BASE"
          else
            echo "::error::PRs to $BASE must come from '$ALLOWED' or 'hotfix/*' (got '$HEAD'). Use the promote workflow. See CONTRIBUTING.md."
            exit 1
          fi
