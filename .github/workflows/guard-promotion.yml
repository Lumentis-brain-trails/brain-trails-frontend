name: guard-promotion
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Only beta or hotfix/* may target main
        run: |
          HEAD="${{ github.head_ref }}"
          if [[ "$HEAD" == "beta" || "$HEAD" == hotfix/* ]]; then
            echo "ok: $HEAD"
          else
            echo "::error::PRs to main must come from 'beta' or 'hotfix/*' (got '$HEAD'). See CONTRIBUTING.md."
            exit 1
          fi
